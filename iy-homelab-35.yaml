            x: 8
            y: 68
            width: 464
            height: 46
            radius: 10
            bg_color: 0x1B2535
            bg_opa: COVER
            border_width: 0
            shadow_width: 0
            pad_all: 0
            on_click:
              - lambda: 'id(sel_node) = 0;'
              - script.execute: refresh_detail
              - lvgl.page.show: detail_page
            widgets:
