        - label: { id: hdr_conn, text: "WiFi", x: 424, y: 16, text_color: 0x829AA8, text_font: montserrat_16 }

        # ---- column headers (aligned to the card content columns) ----
        - label: { text: "NODE", x: 26,  y: 50, text_color: 0x5A6A7A, text_font: montserrat_14 }
        - label: { text: "CPU",  x: 150, y: 50, text_color: 0x66D9A0, text_font: montserrat_14 }
        - label: { text: "MEM",  x: 230, y: 50, text_color: 0xB58BF0, text_font: montserrat_14 }
        - label: { text: "DISK", x: 310, y: 50, text_color: 0x5AC8E8, text_font: montserrat_14 }
        - label: { text: "TEMP", x: 390, y: 50, text_color: 0xF2A65A, text_font: montserrat_14 }

