## IY HOMELAB — 3.5" ILI9488 single-screen monitoring display
## Board: ESP32-S3 (sparkleIoT XH-S3E, N16R8 = 16MB flash / 8MB PSRAM), UART-bridge.
## External 3.5" ILI9488 SPI TFT (Hongxun S219C35002A / "35002 V1.2"), 480x320 landscape.
##
## ONE always-on screen (no pages, no buttons): all three Proxmox nodes with
## CPU / MEMORY / TEMP side-by-side, Kubernetes health, clock, and HA/WiFi
## connectivity. Reuses the SAME Home Assistant entities published by
## integrations/proxmox_bridge.py as iy-homelab.yaml.
##
## Display wiring to the ESP32-S3:
##   TFT SCK  -> IO14    TFT MOSI -> IO9    TFT DC -> IO11
##   TFT RST  -> IO13    TFT CS   -> IO10   TFT LED -> 3V3 (always on)
##   TFT VCC  -> 5V      TFT GND  -> GND    (MISO unused)

substitutions:
  name: iy-homelab-35
  friendly_name: IY Homelab Display 35
  stale_after: "90"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

# 8MB PSRAM — needed for 16-bit color + LVGL buffers on a 480x320 panel.
psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s   # stay up even if HA is briefly unreachable (always-on)

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "IY-HOMELAB-35 Fallback"
    password: !secret ota_password

captive_portal:

time:
  - platform: sntp
    id: local_clock
    timezone: Africa/Johannesburg
    on_time:
      - seconds: 0
        then:
          - lambda: |-
              auto t = id(local_clock).now();
              std::string s = t.is_valid() ? t.strftime("%H:%M") : std::string("--:--");
              lv_label_set_text(id(hdr_clock), s.c_str());

globals:
  - id: last_node_update
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: last_k8s_update
    type: uint32_t
    restore_value: no
    initial_value: "0"
  # Which node (0..2) the detail page is currently showing.
  - id: sel_node
    type: int
    restore_value: no
    initial_value: "0"
  # Attention-pulse phase: flips each tick so an indicator can "breathe" while
  # something needs attention. A healthy screen never pulses (phase ignored).
  - id: pulse_on
    type: bool
    restore_value: no
    initial_value: "false"

spi:
  clk_pin: GPIO14
  mosi_pin: GPIO9

## ---------------------------------------------------------------------------
## Capacitive touch (FT6236 CTP over I2C) — BRING-UP MODE.
## Wiring on THIS board via the RTP/T_* 0.1" header (see docs/hardware-35.md):
##   T_CLK(SCL) -> IO4   T_CS(RST) -> IO5   T_SDI(SDA) -> IO6   T_IRQ(INT) -> IO7
##   VCC -> 3V3   GND -> GND
## i.e. by signal:  SDA -> IO6 | SCL -> IO4 | INT -> IO7 | RST -> IO5
## `scan: true` logs any I2C device at boot — the FT6236 must answer at 0x38.
## The touchscreen `on_touch` just logs coordinates so we can confirm the
## controller works and calibrate the transform BEFORE wiring up any UI action.
## ---------------------------------------------------------------------------
i2c:
  sda: GPIO6
  scl: GPIO4
  scan: true

touchscreen:
  - platform: ft63x6
    id: my_touch
    interrupt_pin: GPIO7
    reset_pin: GPIO5
    # Match the display's landscape rotation; adjust on-bench until a tap
    # top-left registers top-left (see bring-up gate in docs/hardware-35.md).
    # Calibrated on-bench 2026-11-11 with 4-corner taps. Final result:
    #   X tracked correctly with no mirror; Y was inverted (physical top read
    #   high, bottom read low) so mirror_y is required.
    #   TL->(0,0)  TR->(480,0)  BL->(0,320)  BR->(480,320)
    transform:
      swap_xy: true
      mirror_x: false
      mirror_y: true
    on_touch:
      - lambda: |-
          ESP_LOGI("touch", "x=%d y=%d (raw x=%d y=%d)",
                   touch.x, touch.y, touch.x_raw, touch.y_raw);

display:
  - platform: ili9xxx
    id: main_display
    model: ILI9488
    dimensions:
      # NATIVE portrait geometry of the ILI9488 (320 wide x 480 tall).
      # Landscape is produced by the LVGL `transform` below (swap_xy), NOT by
      # pre-rotating these dimensions. Declaring the already-rotated 480x320
      # here *and* swapping axes made LVGL map widget width onto the short
      # physical axis, so `bar`s rendered as tall vertical strips. Declaring
      # native 320x480 + swap_xy gives LVGL a consistent 480x320 landscape
      # canvas, so a 95x7 bar renders as a short horizontal bar.
      width: 320
      height: 480
    cs_pin: GPIO10
    dc_pin: GPIO11
    reset_pin: GPIO13
    data_rate: 20MHz
    color_order: bgr
    invert_colors: true      # matched on bench: ILI9488 panel needs inversion
    transform:               # 270deg landscape, corrected (was mirrored L-R)
      swap_xy: true
      mirror_x: false
      mirror_y: true
    auto_clear_enabled: false
    update_interval: never

## ---------------------------------------------------------------------------
## Home Assistant entity subscriptions (same entities as iy-homelab.yaml)
## ---------------------------------------------------------------------------
sensor:
  - platform: homeassistant
    id: node1_cpu
    entity_id: sensor.kubelab_1_cpu_usage
    on_value: { then: [ lambda: 'id(last_node_update)=(uint32_t)(millis()/1000);', script.execute: refresh_nodes ] }
  - platform: homeassistant
    id: node2_cpu
    entity_id: sensor.kubelab_2_cpu_usage
    on_value: { then: [ lambda: 'id(last_node_update)=(uint32_t)(millis()/1000);', script.execute: refresh_nodes ] }
  - platform: homeassistant
    id: node3_cpu
    entity_id: sensor.kubelab_3_cpu_usage
    on_value: { then: [ lambda: 'id(last_node_update)=(uint32_t)(millis()/1000);', script.execute: refresh_nodes ] }

  - platform: homeassistant
    id: node1_mem
    entity_id: sensor.kubelab_1_memory_usage
    on_value: { then: [ script.execute: refresh_nodes ] }
  - platform: homeassistant
    id: node2_mem
    entity_id: sensor.kubelab_2_memory_usage
    on_value: { then: [ script.execute: refresh_nodes ] }
  - platform: homeassistant
    id: node3_mem
    entity_id: sensor.kubelab_3_memory_usage
    on_value: { then: [ script.execute: refresh_nodes ] }

  - platform: homeassistant
    id: node1_disk
    entity_id: sensor.kubelab_1_disk_usage
    on_value: { then: [ script.execute: refresh_nodes ] }
  - platform: homeassistant
    id: node2_disk
    entity_id: sensor.kubelab_2_disk_usage
    on_value: { then: [ script.execute: refresh_nodes ] }
  - platform: homeassistant
    id: node3_disk
    entity_id: sensor.kubelab_3_disk_usage
    on_value: { then: [ script.execute: refresh_nodes ] }

  - platform: homeassistant
    id: node1_temp
    entity_id: sensor.kubelab_1_temperature
    on_value: { then: [ script.execute: refresh_nodes ] }
  - platform: homeassistant
    id: node2_temp
    entity_id: sensor.kubelab_2_temperature
    on_value: { then: [ script.execute: refresh_nodes ] }
  - platform: homeassistant
    id: node3_temp
    entity_id: sensor.kubelab_3_temperature
    on_value: { then: [ script.execute: refresh_nodes ] }

  - platform: homeassistant
    id: k8s_ready
    entity_id: sensor.homelab_kubernetes_nodes_ready
    on_value: { then: [ lambda: 'id(last_k8s_update)=(uint32_t)(millis()/1000);', script.execute: refresh_k8s ] }
  - platform: homeassistant
    id: k8s_total
    entity_id: sensor.homelab_kubernetes_nodes_total
  - platform: homeassistant
    id: k8s_pods_bad
    entity_id: sensor.homelab_kubernetes_pods_not_ready
    on_value: { then: [ script.execute: refresh_k8s ] }

## ---------------------------------------------------------------------------
## Light on/off states (for the Controls page button colours)
## ---------------------------------------------------------------------------
binary_sensor:
  - platform: homeassistant
    id: light_off1
    entity_id: light.office_office_light_1
    on_state: { then: [ script.execute: refresh_lights ] }
  - platform: homeassistant
    id: light_off2
    entity_id: light.office_office_light_2
    on_state: { then: [ script.execute: refresh_lights ] }
  - platform: homeassistant
    id: light_bed1
    entity_id: light.bedroom_light_1
    on_state: { then: [ script.execute: refresh_lights ] }
  - platform: homeassistant
    id: light_bed2
    entity_id: light.bedroom_light_2
    on_state: { then: [ script.execute: refresh_lights ] }
  - platform: homeassistant
    id: light_bed3
    entity_id: light.bedroom_bedroom_light_3
    on_state: { then: [ script.execute: refresh_lights ] }
  - platform: homeassistant
    id: light_bed4
    entity_id: light.bedroom_bedroom_light_4
    on_state: { then: [ script.execute: refresh_lights ] }

text_sensor:
  - platform: homeassistant
    id: node1_status
    entity_id: sensor.kubelab_1_status
    on_value: { then: [ script.execute: refresh_nodes ] }
  - platform: homeassistant
    id: node2_status
    entity_id: sensor.kubelab_2_status
    on_value: { then: [ script.execute: refresh_nodes ] }
  - platform: homeassistant
    id: node3_status
    entity_id: sensor.kubelab_3_status
    on_value: { then: [ script.execute: refresh_nodes ] }
  - platform: homeassistant
    id: k8s_health
    entity_id: sensor.homelab_kubernetes_health
    on_value: { then: [ script.execute: refresh_k8s ] }

  # Per-node running-VM list (preformatted text from the bridge's `lines`
  # attribute). Rendered on the detail page when a node row is tapped.
  - platform: homeassistant
    id: node1_vms
    entity_id: sensor.kubelab_1_vms
    attribute: lines
    on_value: { then: [ script.execute: refresh_detail ] }
  - platform: homeassistant
    id: node2_vms
    entity_id: sensor.kubelab_2_vms
    attribute: lines
    on_value: { then: [ script.execute: refresh_detail ] }
  - platform: homeassistant
    id: node3_vms
    entity_id: sensor.kubelab_3_vms
    attribute: lines
    on_value: { then: [ script.execute: refresh_detail ] }

## ---------------------------------------------------------------------------
## Render scripts
## ---------------------------------------------------------------------------
script:
  - id: refresh_nodes
    then:
      - lambda: |-
          const char* names[3] = {"kubelab-1", "kubelab-2", "kubelab-3"};
          float cpu[3] = {id(node1_cpu).state, id(node2_cpu).state, id(node3_cpu).state};
          float mem[3] = {id(node1_mem).state, id(node2_mem).state, id(node3_mem).state};
          float tmp[3] = {id(node1_temp).state, id(node2_temp).state, id(node3_temp).state};
          float dsk[3] = {id(node1_disk).state, id(node2_disk).state, id(node3_disk).state};
          std::string st[3] = {id(node1_status).state, id(node2_status).state, id(node3_status).state};
          lv_obj_t* name_lbl[3] = {id(n1_name), id(n2_name), id(n3_name)};
          lv_obj_t* dot[3]      = {id(n1_dot),  id(n2_dot),  id(n3_dot)};
          lv_obj_t* cpu_lbl[3]  = {id(n1_cpu),  id(n2_cpu),  id(n3_cpu)};
          lv_obj_t* cpu_bar[3]  = {id(n1_cpub), id(n2_cpub), id(n3_cpub)};
          lv_obj_t* mem_lbl[3]  = {id(n1_mem),  id(n2_mem),  id(n3_mem)};
          lv_obj_t* mem_bar[3]  = {id(n1_memb), id(n2_memb), id(n3_memb)};
          lv_obj_t* tmp_lbl[3]  = {id(n1_tmp),  id(n2_tmp),  id(n3_tmp)};
          lv_obj_t* tmp_bar[3]  = {id(n1_tmpb), id(n2_tmpb), id(n3_tmpb)};
          lv_obj_t* dsk_lbl[3]  = {id(n1_dsk),  id(n2_dsk),  id(n3_dsk)};
          lv_obj_t* dsk_bar[3]  = {id(n1_dskb), id(n2_dskb), id(n3_dskb)};

          for (int i = 0; i < 3; i++) {
            bool online = (st[i] == "online");
            bool down   = (st[i] == "offline");
            bool kc = online && !std::isnan(cpu[i]);
            bool km = online && !std::isnan(mem[i]);
            bool kt = online && !std::isnan(tmp[i]);
            bool kd = online && !std::isnan(dsk[i]);

            lv_label_set_text(name_lbl[i], names[i]);

            // health dot: worst of cpu/mem, or down/unknown
            uint32_t dcol;
            if (down)            dcol = 0xE8564B;
            else if (!kc && !km) dcol = 0x829AA8;
            else {
              float worst = 0;
              if (kc) worst = cpu[i];
              if (km && mem[i] > worst) worst = mem[i];
              dcol = worst >= 85 ? 0xE8564B : (worst >= 60 ? 0xF4C14E : 0x66D9A0);
            }
            lv_obj_set_style_text_color(dot[i], lv_color_hex(dcol), 0);

            char b[24];
            // CPU
            if (kc) snprintf(b, sizeof(b), "%.0f%%", cpu[i]); else snprintf(b, sizeof(b), down?"DOWN":"--");
            lv_label_set_text(cpu_lbl[i], b);
            uint32_t cc = !kc ? dcol : (cpu[i]>=85?0xE8564B:(cpu[i]>=60?0xF4C14E:0x66D9A0));
            lv_bar_set_value(cpu_bar[i], kc?(int)cpu[i]:0, LV_ANIM_OFF);
            lv_obj_set_style_bg_color(cpu_bar[i], lv_color_hex(cc), (int)LV_PART_INDICATOR);
            // MEM
            if (km) snprintf(b, sizeof(b), "%.0f%%", mem[i]); else snprintf(b, sizeof(b), down?"DOWN":"--");
            lv_label_set_text(mem_lbl[i], b);
            uint32_t mc = !km ? dcol : (mem[i]>=85?0xE8564B:(mem[i]>=60?0xF4C14E:0x66D9A0));
            lv_bar_set_value(mem_bar[i], km?(int)mem[i]:0, LV_ANIM_OFF);
            lv_obj_set_style_bg_color(mem_bar[i], lv_color_hex(mc), (int)LV_PART_INDICATOR);
            // TEMP (0-100C scale; <70 green, 70-85 amber, >=85 red)
            if (kt) snprintf(b, sizeof(b), "%.0fC", tmp[i]); else snprintf(b, sizeof(b), down?"DOWN":"--");
            lv_label_set_text(tmp_lbl[i], b);
            uint32_t tc = !kt ? dcol : (tmp[i]>=85?0xE8564B:(tmp[i]>=70?0xF4C14E:0x66D9A0));
            lv_bar_set_value(tmp_bar[i], kt?(int)tmp[i]:0, LV_ANIM_OFF);
            lv_obj_set_style_bg_color(tmp_bar[i], lv_color_hex(tc), (int)LV_PART_INDICATOR);
            // DISK (local-lvm %; <60 green, 60-85 amber, >=85 red)
            if (kd) snprintf(b, sizeof(b), "%.0f%%", dsk[i]); else snprintf(b, sizeof(b), down?"DOWN":"--");
            lv_label_set_text(dsk_lbl[i], b);
            uint32_t dc = !kd ? dcol : (dsk[i]>=85?0xE8564B:(dsk[i]>=60?0xF4C14E:0x66D9A0));
            lv_bar_set_value(dsk_bar[i], kd?(int)dsk[i]:0, LV_ANIM_OFF);
            lv_obj_set_style_bg_color(dsk_bar[i], lv_color_hex(dc), (int)LV_PART_INDICATOR);
          }
      # Keep an open detail page in sync with the same data.
      - script.execute: refresh_detail

  - id: refresh_k8s
    then:
      - lambda: |-
          std::string h = id(k8s_health).state;
          uint32_t col = 0x829AA8;
          std::string txt = "K8S  --";
          if (!h.empty() && h != "unknown" && h != "unavailable") {
            if (h == "Healthy")       col = 0x66D9A0;
            else if (h == "Degraded") col = 0xF4C14E;
            else if (h == "Critical") col = 0xE8564B;
            char b[64];
            float rd = id(k8s_ready).state, tot = id(k8s_total).state, bad = id(k8s_pods_bad).state;
            if (!std::isnan(rd) && !std::isnan(tot))
              snprintf(b, sizeof(b), "K8S  %s   Ready %.0f/%.0f   Pods bad %.0f",
                       h.c_str(), rd, tot, std::isnan(bad)?0:bad);
            else
              snprintf(b, sizeof(b), "K8S  %s", h.c_str());
            txt = b;
          }
          lv_label_set_text(id(k8s_label), txt.c_str());
          lv_obj_set_style_text_color(id(k8s_label), lv_color_hex(col), 0);
          lv_obj_set_style_text_color(id(k8s_dot), lv_color_hex(col), 0);

  # Fill the single reusable detail page from the currently-selected node
  # (id(sel_node), 0..2). Shows the node's RUNNING Proxmox VMs (name/cpu/mem)
  # from the bridge's preformatted `lines` attribute — node CPU/MEM/TEMP stay
  # on the overview. Called when the detail page opens and when VM data updates.
  - id: refresh_detail
    then:
      - lambda: |-
          const char* names[3] = {"kubelab-1", "kubelab-2", "kubelab-3"};
          std::string vmtxt[3] = {
            id(node1_vms).has_state() ? id(node1_vms).state : std::string(""),
            id(node2_vms).has_state() ? id(node2_vms).state : std::string(""),
            id(node3_vms).has_state() ? id(node3_vms).state : std::string("")
          };
          int i = id(sel_node);
          if (i < 0 || i > 2) i = 0;

          lv_label_set_text(id(d_name), names[i]);

          std::string body = vmtxt[i];
          if (body.empty()) body = "(loading VMs...)";
          lv_label_set_text(id(d_vmlist), body.c_str());

          // count = number of newline-separated lines (unless the placeholder)
          int cnt = 0;
          if (!body.empty() && body[0] != '(') {
            cnt = 1;
            for (char c : body) if (c == '\n') cnt++;
          }
          char h[32];
          snprintf(h, sizeof(h), "%d running VM%s", cnt, cnt==1?"":"s");
          lv_label_set_text(id(d_vmcount), h);

  # Drive the 6 light switches (beui Switch): ON -> track amber + thumb slides
  # right and brightens; OFF -> track slate + thumb left and dim. Thumb travel
  # = track width - thumb width - 2*inset. Office track 56/thumb22 -> x 3..31;
  # bedroom track 48/thumb18 -> x 3..27.
  - id: refresh_lights
    then:
      - lambda: |-
          bool on[6] = {
            id(light_off1).state, id(light_off2).state,
            id(light_bed1).state, id(light_bed2).state,
            id(light_bed3).state, id(light_bed4).state
          };
          lv_obj_t* track[6] = {id(sw_off1), id(sw_off2), id(sw_bed1), id(sw_bed2), id(sw_bed3), id(sw_bed4)};
          lv_obj_t* thumb[6] = {id(th_off1), id(th_off2), id(th_bed1), id(th_bed2), id(th_bed3), id(th_bed4)};
          int thumb_on_x[6] = {31, 31, 27, 27, 27, 27};  // office vs bedroom travel
          for (int i = 0; i < 6; i++) {
            uint32_t tcol = on[i] ? 0xF4C14E : 0x27313F;        // track: amber on / slate off
            uint32_t hcol = on[i] ? 0x1B2535 : 0x5A6A7A;        // thumb: dark knob on amber / grey off
            lv_obj_set_style_bg_color(track[i], lv_color_hex(tcol), 0);
            lv_obj_set_style_bg_color(thumb[i], lv_color_hex(hcol), 0);
            lv_obj_set_x(thumb[i], on[i] ? thumb_on_x[i] : 3);
          }

interval:
  - interval: 5s
    then:
      - lambda: |-
          bool ha = api::global_api_server != nullptr && api::global_api_server->is_connected();
          bool wifi = wifi::global_wifi_component != nullptr && wifi::global_wifi_component->is_connected();
          uint32_t now = (uint32_t)(millis()/1000);
          char f[64];
          if (ha) {
            uint32_t age = id(last_node_update)>0 ? now-id(last_node_update) : 0;
            snprintf(f, sizeof(f), "HA connected  -  updated %us ago", age);
          } else snprintf(f, sizeof(f), wifi?"WiFi only - waiting for HA":"Offline");
          lv_label_set_text(id(foot_label), f);
          uint32_t fcol = ha ? 0x66D9A0 : (wifi ? 0xF4C14E : 0xE8564B);
          lv_obj_set_style_text_color(id(foot_label), lv_color_hex(fcol), 0);
          lv_label_set_text(id(hdr_conn), ha?"HA":"WiFi");
          lv_obj_set_style_text_color(id(hdr_conn), lv_color_hex(fcol), 0);

          // staleness -> grey dots
          if (!ha || (id(last_node_update)>0 && now-id(last_node_update) > ${stale_after})) {
            lv_obj_t* dots[3] = {id(n1_dot), id(n2_dot), id(n3_dot)};
            for (int i=0;i<3;i++) lv_obj_set_style_text_color(dots[i], lv_color_hex(0x829AA8), 0);
          }
          if (!ha || (id(last_k8s_update)>0 && now-id(last_k8s_update) > ${stale_after}))
            lv_obj_set_style_text_color(id(k8s_dot), lv_color_hex(0x829AA8), 0);

  # Attention pulse (beui Animated Badge "pulse feedback"), done with a plain
  # 700ms interval instead of the LVGL animation engine (unsupported in this
  # ESPHome build) — the connectivity chip breathes ONLY while HA is down, so a
  # healthy screen is perfectly still. Motion here means "look here".
  - interval: 700ms
    then:
      - lambda: |-
          bool ha = api::global_api_server != nullptr && api::global_api_server->is_connected();
          if (ha) {
            lv_obj_set_style_opa(id(hdr_conn), 255, 0);   // solid when healthy
            id(pulse_on) = false;
            return;
          }
          id(pulse_on) = !id(pulse_on);
          lv_obj_set_style_opa(id(hdr_conn), id(pulse_on) ? 90 : 255, 0);

font:
  - id: dot_font
    # size matched to the row text (montserrat_16) so the dot box and the
    # label box are the same height and share the same top `y` -> the dot
    # sits on the same line as "kubelab-N" / CPU / MEM / TEMP (no float).
    file: "gfonts://Montserrat@700"
    size: 16
    glyphs: ["\U00002022"]
  - id: mono_font
    # Monospaced font so the per-VM "name  cpu%  mem%" columns line up on the
    # detail page (Montserrat is proportional and would misalign the columns).
    file: "gfonts://Roboto+Mono@500"
    size: 16

## ---------------------------------------------------------------------------
## LVGL — ONE page, 480x320 landscape. Columns: NODE | CPU | MEM | TEMP.
## ---------------------------------------------------------------------------
lvgl:
  buffer_size: 25%
  color_depth: 16
  displays:
    - main_display
  bg_color: 0x0E1420
  text_color: 0xE8F2FA
  # Global button feel (beui "spring-pressed" Button, translated to LVGL):
  # every button gets a tactile pressed look — darker fill + a 2px inset (via
  # translate/transform) so the tap reads physically. Applied cluster-wide via
  # theme so the whole UI shares one press language, not per-button costumes.
  # (Animated easing lives in the page transitions and the light switch thumb;
  #  ESPHome's LVGL layer applies state styles instantly, which on a 20MHz SPI
  #  panel is the right call — a crisp press beats a janky per-button tween.)
  theme:
    button:
      pressed:
        translate_y: 2
        transform_height: -2
        transform_width: -2
  pages:
    - id: main_page
      widgets:
        # ---- header ----
        - label: { text: "KUBELAB", x: 14, y: 10, text_color: 0x75D8FD, text_font: montserrat_22 }
