            on_click:
              - script.execute: refresh_lights
              - lvgl.page.show: controls_page

    ## -----------------------------------------------------------------------
    ## Detail page — RUNNING Proxmox VMs on the tapped node (id(sel_node)).
    ## Opened by tapping a node row on the overview; "< BACK" returns home.
    ## -----------------------------------------------------------------------
    - id: detail_page
      widgets:
        # header: back button + node name + running VM count
        - button:
            id: d_back
            x: 8
            y: 8
            width: 110
            height: 34
            bg_color: 0x1B2535
            border_width: 0
            shadow_width: 0
            widgets:
              - label: { text: "< BACK", align: CENTER, text_color: 0x75D8FD, text_font: montserrat_16 }
            on_click:
              - lvgl.page.show: main_page
        - label: { id: d_name,    text: "kubelab-?", x: 140, y: 12, text_color: 0x75D8FD, text_font: montserrat_22 }
        - label: { id: d_vmcount, text: "-- VMs", x: 330, y: 18, text_color: 0x829AA8, text_font: montserrat_16 }
        - line:  { points: [[12, 50], [468, 50]], line_color: 0x27313F, line_width: 2 }

        # column header (monospace, aligned with the list below)
        - label: { text: "VM                    CPU   MEM", x: 16, y: 58, text_color: 0x829AA8, text_font: mono_font }
        - line:  { points: [[12, 80], [468, 80]], line_color: 0x27313F, line_width: 1 }

        # VM list — one preformatted monospace block from the bridge `lines` attr
        - label:
            id: d_vmlist
            text: "(loading VMs...)"
            x: 16
            y: 88
            text_color: 0xE8F2FA
            text_font: mono_font

        - label: { text: "running VMs only - busiest first - tap BACK to return", x: 16, y: 296, text_color: 0x4A5A6A, text_font: montserrat_14 }

    ## -----------------------------------------------------------------------
    ## Controls page — room tabs (Office / Bedroom) + Scenes. Each light is a
    ## wide button showing name + ON/OFF status (readable from across a room).
    ## Low-risk, reversible -> single tap. Each action is an HA service call.
    ## -----------------------------------------------------------------------
    - id: controls_page
      widgets:
        - button:
            id: c_back
            x: 8
            y: 8
            width: 100
            height: 34
            bg_color: 0x1B2535
            border_width: 0
            shadow_width: 0
            widgets:
              - label: { text: "< BACK", align: CENTER, text_color: 0x75D8FD, text_font: montserrat_16 }
            on_click:
              - lvgl.page.show: main_page
        - label: { text: "CONTROLS", x: 120, y: 12, text_color: 0x75D8FD, text_font: montserrat_22 }

        # Tabview: swipe between tabs or tap the tab names at the top.
        # Dark-themed to match the overview card world — LVGL's default tabview
        # theme is light, which showed as a white tab bar + bright content area.
        - tabview:
            id: ctl_tabs
            position: top
            y: 50
            x: 0
            width: 480
            height: 270
            bg_color: 0x0E1420
            bg_opa: COVER
            # Tabs switch ONLY by tapping the tab button — no swipe/drag between
            # Office/Bedroom, and the change snaps (no slide). The swipe gesture
            # lives on the tabview content container; clear its SCROLLABLE flag
            # at boot to disable it (LVGL-documented method).
            on_boot:
              - lambda: |-
                  // Kill swipe + scroll everywhere in the tabview: the content
                  // wrapper AND each tab page. This removes the horizontal
                  // scrollbar and stops the other tab's widgets peeking in.
                  lv_obj_t * content = lv_tabview_get_content(id(ctl_tabs));
                  if (content) lv_obj_clear_flag(content, LV_OBJ_FLAG_SCROLLABLE);
                  lv_obj_clear_flag(id(tab_office), LV_OBJ_FLAG_SCROLLABLE);
                  lv_obj_clear_flag(id(tab_bedroom), LV_OBJ_FLAG_SCROLLABLE);
            # tab bar: dark, cyan bottom accent as the indicator baseline;
            # `items` (nested) styles each tab button + its checked/active state
            tab_style:
              bg_color: 0x0E1420
              bg_opa: COVER
              border_color: 0x27313F
              border_width: 1
              border_side: BOTTOM
              text_color: 0x5A6A7A
              pad_all: 0
              items:
                bg_color: 0x0E1420
                bg_opa: COVER
                text_color: 0x5A6A7A
                text_font: montserrat_16
                border_color: 0x75D8FD
                border_width: 0
                checked:
                  text_color: 0x75D8FD
                  border_color: 0x75D8FD
                  border_width: 3
                  border_side: BOTTOM
            # content area: page background, no light surface
            content_style:
              bg_color: 0x0E1420
              bg_opa: COVER
              border_width: 0
              pad_all: 6
            on_value:
              - script.execute: refresh_lights
            tabs:
              - name: "OFFICE"
                id: tab_office
                # Centered vertical flex: children are auto-positioned and
                # constrained inside the tab (no absolute x/y escaping bounds,
                # so no peeking into the other tab), and centered on the cross
                # axis. pad_all also sets the inter-row gap.
                layout:
                  type: flex
                  flex_flow: COLUMN
                  flex_align_main: START
                  flex_align_cross: CENTER
                  pad_row: 10
                pad_all: 10
                widgets:
                  - button:
                      id: lb_off1
                      width: 440
                      height: 48
                      bg_color: 0x1B2535
                      border_width: 0
                      shadow_width: 0
                      widgets:
                        - label: { text: "Office 1", align: LEFT_MID, x: 16, text_color: 0xE8F2FA, text_font: montserrat_22 }
                        - obj:
                            id: sw_off1
                            x: -16
                            align: RIGHT_MID
                            width: 56
                            height: 28
                            radius: 14
                            bg_color: 0x27313F
                            bg_opa: COVER
                            border_width: 0
                            pad_all: 0
                            widgets:
                              - obj: { id: th_off1, x: 3, align: LEFT_MID, width: 22, height: 22, radius: 11, bg_color: 0x5A6A7A, bg_opa: COVER, border_width: 0 }
                      on_click:
                        - homeassistant.action:
                            action: light.toggle
                            data: { entity_id: light.office_office_light_1 }
                  - button:
                      id: lb_off2
                      width: 440
                      height: 48
                      bg_color: 0x1B2535
                      border_width: 0
                      shadow_width: 0
                      widgets:
                        - label: { text: "Office 2", align: LEFT_MID, x: 16, text_color: 0xE8F2FA, text_font: montserrat_22 }
                        - obj:
                            id: sw_off2
                            x: -16
                            align: RIGHT_MID
                            width: 56
                            height: 28
                            radius: 14
                            bg_color: 0x27313F
                            bg_opa: COVER
                            border_width: 0
                            pad_all: 0
                            widgets:
                              - obj: { id: th_off2, x: 3, align: LEFT_MID, width: 22, height: 22, radius: 11, bg_color: 0x5A6A7A, bg_opa: COVER, border_width: 0 }
                      on_click:
                        - homeassistant.action:
                            action: light.toggle
                            data: { entity_id: light.office_office_light_2 }
                  - label: { text: "SCENES", text_color: 0xB58BF0, text_font: montserrat_14 }
                  # scene buttons in a centered horizontal row
                  - obj:
                      width: 440
                      height: 48
                      bg_opa: TRANSP
                      border_width: 0
                      pad_all: 0
                      layout:
                        type: flex
                        flex_flow: ROW
                        flex_align_main: CENTER
                        flex_align_cross: CENTER
                        pad_column: 12
                      widgets:
                        - button:
                            width: 210
                            height: 48
                            bg_color: 0x2A2140
                            border_width: 0
                            shadow_width: 0
                            widgets:
                              - label: { text: "Jazziro Focus", align: CENTER, text_color: 0xE8F2FA, text_font: montserrat_16 }
                            on_click:
                              - homeassistant.action:
                                  action: scene.turn_on
                                  data: { entity_id: scene.jazziro_focus }
                        - button:
                            width: 210
                            height: 48
                            bg_color: 0x2A2140
                            border_width: 0
                            shadow_width: 0
                            widgets:
                              - label: { text: "Lerato Focus", align: CENTER, text_color: 0xE8F2FA, text_font: montserrat_16 }
                            on_click:
                              - homeassistant.action:
                                  action: scene.turn_on
                                  data: { entity_id: scene.lerato_study_focus }
              - name: "BEDROOM"
                id: tab_bedroom
                layout:
                  type: flex
                  flex_flow: COLUMN
                  flex_align_main: START
                  flex_align_cross: CENTER
                  pad_row: 8
                pad_all: 10
                widgets:
                  # Bed 1 + Bed 2 in a centered row
                  - obj:
                      width: 440
                      height: 48
                      bg_opa: TRANSP
                      border_width: 0
                      pad_all: 0
                      layout: { type: flex, flex_flow: ROW, flex_align_main: CENTER, flex_align_cross: CENTER, pad_column: 12 }
                      widgets:
                        - button:
                            id: lb_bed1
                            width: 214
                            height: 48
                            bg_color: 0x1B2535
                            border_width: 0
                            shadow_width: 0
                            widgets:
                              - label: { text: "Bed 1", align: LEFT_MID, x: 12, text_color: 0xE8F2FA, text_font: montserrat_16 }
                              - obj:
                                  id: sw_bed1
                                  x: -12
                                  align: RIGHT_MID
                                  width: 48
                                  height: 24
                                  radius: 12
                                  bg_color: 0x27313F
                                  bg_opa: COVER
                                  border_width: 0
                                  pad_all: 0
                                  widgets:
                                    - obj: { id: th_bed1, x: 3, align: LEFT_MID, width: 18, height: 18, radius: 9, bg_color: 0x5A6A7A, bg_opa: COVER, border_width: 0 }
                            on_click:
                              - homeassistant.action:
                                  action: light.toggle
                                  data: { entity_id: light.bedroom_light_1 }
                        - button:
                            id: lb_bed2
                            width: 214
                            height: 48
                            bg_color: 0x1B2535
                            border_width: 0
                            shadow_width: 0
                            widgets:
                              - label: { text: "Bed 2", align: LEFT_MID, x: 12, text_color: 0xE8F2FA, text_font: montserrat_16 }
                              - obj:
                                  id: sw_bed2
                                  x: -12
                                  align: RIGHT_MID
                                  width: 48
                                  height: 24
                                  radius: 12
                                  bg_color: 0x27313F
                                  bg_opa: COVER
                                  border_width: 0
                                  pad_all: 0
                                  widgets:
                                    - obj: { id: th_bed2, x: 3, align: LEFT_MID, width: 18, height: 18, radius: 9, bg_color: 0x5A6A7A, bg_opa: COVER, border_width: 0 }
                            on_click:
                              - homeassistant.action:
                                  action: light.toggle
                                  data: { entity_id: light.bedroom_light_2 }
                  # Bed 3 + Bed 4 in a centered row
                  - obj:
                      width: 440
                      height: 48
                      bg_opa: TRANSP
                      border_width: 0
                      pad_all: 0
                      layout: { type: flex, flex_flow: ROW, flex_align_main: CENTER, flex_align_cross: CENTER, pad_column: 12 }
                      widgets:
                        - button:
                            id: lb_bed3
                            width: 214
                            height: 48
                            bg_color: 0x1B2535
                            border_width: 0
                            shadow_width: 0
                            widgets:
                              - label: { text: "Bed 3", align: LEFT_MID, x: 12, text_color: 0xE8F2FA, text_font: montserrat_16 }
                              - obj:
                                  id: sw_bed3
                                  x: -12
                                  align: RIGHT_MID
                                  width: 48
                                  height: 24
                                  radius: 12
                                  bg_color: 0x27313F
                                  bg_opa: COVER
                                  border_width: 0
                                  pad_all: 0
                                  widgets:
                                    - obj: { id: th_bed3, x: 3, align: LEFT_MID, width: 18, height: 18, radius: 9, bg_color: 0x5A6A7A, bg_opa: COVER, border_width: 0 }
                            on_click:
                              - homeassistant.action:
                                  action: light.toggle
