              - label: { id: n1_name, text: "kubelab-1", x: 32, y: 0, align: LEFT_MID, text_font: montserrat_16 }
              - label: { id: n1_cpu,  text: "--", x: 150, y: 6, text_font: montserrat_16 }
              - bar:   { id: n1_cpub, x: 150, y: 30, width: 64, height: 6, radius: 3, min_value: 0, max_value: 100, value: 0 }
              - label: { id: n1_mem,  text: "--", x: 230, y: 6, text_font: montserrat_16 }
              - bar:   { id: n1_memb, x: 230, y: 30, width: 64, height: 6, radius: 3, min_value: 0, max_value: 100, value: 0 }
              - label: { id: n1_tmp,  text: "--", x: 390, y: 6, text_font: montserrat_16 }
              - bar:   { id: n1_tmpb, x: 390, y: 30, width: 64, height: 6, radius: 3, min_value: 0, max_value: 100, value: 0 }
              - label: { id: n1_dsk,  text: "--", x: 310, y: 6, text_font: montserrat_16 }
              - bar:   { id: n1_dskb, x: 310, y: 30, width: 64, height: 6, radius: 3, min_value: 0, max_value: 100, value: 0 }
        - button:
            id: n2_hit
            x: 8
            y: 120
            width: 464
            height: 46
            radius: 10
            bg_color: 0x1B2535
            bg_opa: COVER
            border_width: 0
            shadow_width: 0
            pad_all: 0
            on_click:
              - lambda: 'id(sel_node) = 1;'
              - script.execute: refresh_detail
              - lvgl.page.show: detail_page
            widgets:
              - label: { id: n2_dot,  text: "\u2022", x: 14, y: 0, align: LEFT_MID, text_color: 0x829AA8, text_font: dot_font }
              - label: { id: n2_name, text: "kubelab-2", x: 32, y: 0, align: LEFT_MID, text_font: montserrat_16 }
              - label: { id: n2_cpu,  text: "--", x: 150, y: 6, text_font: montserrat_16 }
              - bar:   { id: n2_cpub, x: 150, y: 30, width: 64, height: 6, radius: 3, min_value: 0, max_value: 100, value: 0 }
              - label: { id: n2_mem,  text: "--", x: 230, y: 6, text_font: montserrat_16 }
              - bar:   { id: n2_memb, x: 230, y: 30, width: 64, height: 6, radius: 3, min_value: 0, max_value: 100, value: 0 }
              - label: { id: n2_tmp,  text: "--", x: 390, y: 6, text_font: montserrat_16 }
              - bar:   { id: n2_tmpb, x: 390, y: 30, width: 64, height: 6, radius: 3, min_value: 0, max_value: 100, value: 0 }
              - label: { id: n2_dsk,  text: "--", x: 310, y: 6, text_font: montserrat_16 }
              - bar:   { id: n2_dskb, x: 310, y: 30, width: 64, height: 6, radius: 3, min_value: 0, max_value: 100, value: 0 }
        - button:
            id: n3_hit
            x: 8
            y: 172
            width: 464
            height: 46
            radius: 10
            bg_color: 0x1B2535
            bg_opa: COVER
            border_width: 0
            shadow_width: 0
            pad_all: 0
            on_click:
              - lambda: 'id(sel_node) = 2;'
              - script.execute: refresh_detail
              - lvgl.page.show: detail_page
            widgets:
              - label: { id: n3_dot,  text: "\u2022", x: 14, y: 0, align: LEFT_MID, text_color: 0x829AA8, text_font: dot_font }
              - label: { id: n3_name, text: "kubelab-3", x: 32, y: 0, align: LEFT_MID, text_font: montserrat_16 }
              - label: { id: n3_cpu,  text: "--", x: 150, y: 6, text_font: montserrat_16 }
              - bar:   { id: n3_cpub, x: 150, y: 30, width: 64, height: 6, radius: 3, min_value: 0, max_value: 100, value: 0 }
              - label: { id: n3_mem,  text: "--", x: 230, y: 6, text_font: montserrat_16 }
              - bar:   { id: n3_memb, x: 230, y: 30, width: 64, height: 6, radius: 3, min_value: 0, max_value: 100, value: 0 }
              - label: { id: n3_tmp,  text: "--", x: 390, y: 6, text_font: montserrat_16 }
              - bar:   { id: n3_tmpb, x: 390, y: 30, width: 64, height: 6, radius: 3, min_value: 0, max_value: 100, value: 0 }
              - label: { id: n3_dsk,  text: "--", x: 310, y: 6, text_font: montserrat_16 }
              - bar:   { id: n3_dskb, x: 310, y: 30, width: 64, height: 6, radius: 3, min_value: 0, max_value: 100, value: 0 }

        # ---- kubernetes row (rounded surface to match the node cards) ----
        - obj:
            x: 8
            y: 224
