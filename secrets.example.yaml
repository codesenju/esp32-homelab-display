# Copy to secrets.yaml (gitignored) and fill in real values.
#   cp secrets.example.yaml secrets.yaml
wifi_ssid: "YOUR_2_4_GHZ_SSID"
wifi_password: "YOUR_WIFI_PASSWORD"

# OTA password: a long random string. Generate with:
#   python3 -c "import secrets;print(secrets.token_hex(24))"
ota_password: "CHOOSE_A_LONG_RANDOM_PASSWORD"

# ESPHome native API encryption key (base64, 32 bytes). Generate with:
#   python3 -c "import secrets,base64;print(base64.b64encode(secrets.token_bytes(32)).decode())"
api_encryption_key: "BASE64_32_BYTE_KEY"
